name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  ANDROID_API: '35'
  ANDROID_NDK_VERSION: '27.2.12479018'

jobs:
  windows:
    name: Windows EXE/MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows
        run: npm run tauri build -- --ci
      - name: Verify bundles
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle
      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: git-folder-sync-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    name: Android APK (ARM64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
      - name: Configure Android/OpenSSL toolchain
        shell: bash
        run: |
          export NDK="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Build Android APK
        run: npm run android:build
      - name: Verify APK
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: git-folder-sync-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
